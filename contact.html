</head>

    <header id="main-header">
        <nav>
            <ul>
                <li><a href="index.html">Главная</a></li>

                <li><a href="delivery.html">Доставка</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="text-center">Оставьте заявку</h1>
        <img src="images/contact.jfif" alt="Связь с нами" style="display: block; margin: 0 auto 20px auto; width: 50%;">
        
        <form class="contact-form">
            <label for="username">Имя:</label>
            <input type="text" id="username" name="username" placeholder="Ваше имя" required>

            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" placeholder="ваш@email.com" required>

            <label for="subject">Тема обращения:</label>
            <select id="subject" name="subject">
                <option value="order">Статус заказа</option>
                <option value="consultation">Подбор аромата</option>
                <option value="partnership">Сотрудничество</option>
            </select>

            <label for="color">Любимый цвет (для дизайна подарочной коробки):</label><br>
            <input type="color" id="color" name="color" value="#cda434" style="margin-bottom: 20px;"><br>

            <label for="message">Сообщение:</label>
            <textarea id="message" name="message" rows="5" placeholder="Напишите ваш вопрос..." required></textarea>

            <button type="submit" class="btn-submit">Отправить</button>
        </form>
    </main>

    <footer class="site-footer">
       <p>Команда: Rymbek Beknur, Matzhan Arlan, Arman Sultangaliev, Meirambek Samenkhan | Группа: SE-2505</p>
    </footer>
</body>
